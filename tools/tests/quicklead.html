<!doctype html>
<html><body><pre id="out">running</pre>
<iframe id="f" style="width:1280px;height:900px"></iframe>
<script>
var ROOT = "../../", LEADS = ROOT + "features/leads/index.html", TODAY = ROOT + "features/today/index.html", PKGS = ROOT + "features/settings/packages.html";
var out = [], fr = document.getElementById("f");
function ok(name, cond, extra) { out.push((cond ? "PASS " : "FAIL ") + name + (extra != null && !cond ? "  [" + extra + "]" : "")); }
function load(url, cb, w) { fr.style.width = (w || 1280) + "px"; fr.onload = function () { setTimeout(cb, 800); }; fr.src = url; }
function W() { return fr.contentWindow; } function Dc() { return W().document; }
function q(s) { return Dc().querySelector(s); } function qa(s) { return Dc().querySelectorAll(s); }
function key(k) { (Dc().activeElement || Dc().body).dispatchEvent(new (W().KeyboardEvent)("keydown", { key: k, bubbles: true })); }
function click(el) { if (!el) throw new Error("missing element"); el.dispatchEvent(new (W().MouseEvent)("click", { bubbles: true })); }
function text(s) { var e = q(s); return e ? e.innerText : ""; }
function type(sel, v, ev) { var e = q(sel); e.value = v; e.dispatchEvent(new (W().Event)(ev || "input", { bubbles: true })); }
function pickSel(id, val) { click(q('[data-dd="sel-' + id + '"]')); click(q('[data-sel="' + id + '"][data-val="' + val + '"]')); }
function D() { return W().DUMMY; }
function QD() { return q("#quickLeadDrawer"); } function qOpen() { return !!QD() && QD().classList.contains("open"); }
function width(id) { return q("#" + id).getBoundingClientRect().width; }
function badText() { return /\bnull\b|\bundefined\b|Jan 0001|\[object Object\]|NaN|Invalid Date/.exec(Dc().body.innerText); }
function change(sel, v) { var e = q(sel); e.value = v; e.dispatchEvent(new (W().Event)("change", { bubbles: true })); }
function step(name, fn) { try { fn(); } catch (e) { ok(name + " (threw)", false, e.message); } }

load(LEADS, function () {
  W().sessionStorage.setItem("mock.role", "Sales Executive"); W().sessionStorage.setItem("mock.branch", "b1");
  W().sessionStorage.removeItem("mock.prefs");
  load(LEADS, function () {
    step("+ Lead opens the quick lead drawer", function () {
      click(q(".topbar [data-new-lead]"));
      ok("opens as a drawer, not a modal", qOpen() && !q(".modal.open"));
      ok("defaults: Warm, owner me, branch Sec 31", /Warm/.test(text("#quickLeadDrawer .seg-btn.active")) && q("#qlOwner").value === "u6" && q("#qlBranch").value === "b1");
      ok("Mobile first, Name second", /Mobile/.test(QD().querySelectorAll(".field label")[0].textContent) && /Name/.test(QD().querySelectorAll(".field label")[1].textContent));
      ok("More details hidden until asked", !q("[data-ql-more]") && !q("#qlEmail"));
      click(q('[data-ql="save"]'));
      ok("required: name, mobile, source", /Name is required/.test(text("#quickLeadDrawer")) && /10-digit/.test(text("#quickLeadDrawer")) && /Choose a source/.test(text("#quickLeadDrawer")));
      type("#qlMobile", "90000 01234");
      ok("live duplicate (lead I can see): what + owner + branch + Open profile", /Already a lead · Owner Priya · Sec 31/.test(text("[data-qldup]")) && !!q('[data-ql="openDup"]'), text("[data-qldup]"));
      type("#qlMobile", "90000 01244");
      ok("live duplicate (lead I can't see): only exists + owner + branch, no Open profile", /Already a lead · Owner Pooja · Golf Course/.test(text("[data-qldup]")) && !q('[data-ql="openDup"]') && !/Pooja Khanna|Request access/.test(text("[data-qldup]")), text("[data-qldup]"));
      (function () {
        var A = W().App, c = A.byId(D().people, "p12");
        type("#qlMobile", c.mobile);
        ok("duplicate client: Already a client · CL no · branch", new RegExp("Already a client · " + c.clientNo + " · Sec 31").test(text("[data-qldup]")), text("[data-qldup]"));
        type("#qlMobile", "90000 09003");
        ok("staff number: This number belongs to a staff member", /This number belongs to a staff member/.test(text("[data-qldup]")) && !/Sunita|Vikram/.test(text("[data-qldup]")), text("[data-qldup]"));
        ok("E.164: input normalized (+91 / 0 / spaces) before the check", A.toE164("+91", "090000 01234") === "+919000001234" && A.toE164("+91", "+91 90000-01234") === "+919000001234" && A.toE164("+91", "919000001234") === "+919000001234" &&
          !!A.findByPhone(A.toE164("+91", "9000001234")) && A.phoneOf(c) === "+91" + A.mobileDigits(c.mobile));
      })();
      type("#qlMobile", "90000 07777");
      ok("unique number clears the message", q("[data-qldup]").hidden);
      click(q('[data-ql="more"]'));
      ok("More details: email, gender, birth date, inquiry, campaign, remarks", !!q("#qlEmail") && !!q("#qlGender") && !!q("#qlBirth") && !!q("#qlInq") && !!q("#qlCamp") && !!q("#qlRem") && !!q("#qlFf"));
      (function () {
        var A = W().App, opts = function () { return Array.prototype.map.call(qa("#qlSource option"), function (o) { return o.textContent; }); };
        ok("source dropdown: all-branch sources + this branch's (#115)", A.sourcesFor("b1").indexOf("Hoarding") > -1 && A.sourcesFor("b3").indexOf("Hoarding") < 0 && A.sourcesFor("b3").indexOf("Pamphlet") < 0 && A.sourcesFor("b2").indexOf("Pamphlet") > -1 && A.sourcesFor("b3").indexOf("Walk-in") > -1);
        var b = q("#qlBranch").value; ok("quick lead Source list follows the lead's branch", JSON.stringify(opts().slice(1)) === JSON.stringify(A.sourcesFor(b)), b + ": " + opts().join());
      })();
      type("#qlName", "Tanvi Desai"); pickSel("qlSource", "Referral");
      type("#qlEmail", "aarav.patel@example.com"); click(q('[data-ql="save"]'));
      ok("email must be unique", /already used/.test(text("#quickLeadDrawer")) && qOpen());
      type("#qlEmail", "tanvi.desai@example.com"); type("#qlFf", "FF-20702"); click(q('[data-ql="save"]'));
      ok("FF ID unique (other branch message)", /Already exists in Sec 65/.test(text("#quickLeadDrawer")) && qOpen());
      type("#qlFf", "FF-31000");
      click(q('[data-qltemp="Hot"]'));
      ok("width follows the drawer setting (70%)", Math.abs(width("quickLeadDrawer") - W().innerWidth * 0.7) < 3, width("quickLeadDrawer"));
      var before = D().people.length, badgeBefore = text('.nav-item[data-tip="Today"] .nav-badge');
      click(q('[data-ql="save"]'));
      var p = D().people[D().people.length - 1];
      ok("lead saved with defaults", D().people.length === before + 1 && p.name === "Tanvi Desai" && p.stage === "New" && p.temperature === "Hot" && p.ownerUserId === "u6" && p.branchId === "b1" && p.mobile === "90000 07777" && p.createdByUserId === "u6" && p.ffId === "FF-31000");
      ok("profile opens on the new lead", q("#profileDrawer").classList.contains("open") && /Tanvi Desai/.test(text(".pd-left")) && !qOpen());
      ok("asks for the first follow-up", q("#fuAddModal").classList.contains("open") && /Set first follow-up/.test(text("#fuAddModal")));
      ok("list shows the new lead", !!q('#rows tr[data-id="' + p.id + '"]'));
      ok("Today badge counts it (no follow-up yet)", +text('.nav-item[data-tip="Today"] .nav-badge') === +badgeBefore + 1, badgeBefore + " -> " + text('.nav-item[data-tip="Today"] .nav-badge'));
      click(q("#fuAddModal [data-save]"));
      ok("follow-up saved, badge back", +text('.nav-item[data-tip="Today"] .nav-badge') === +badgeBefore);
      key("Escape");
      ok("no bad text", !badText(), badText());
    });
    step("Create lead with this number (list + search)", function () {
      type("#fSearch", "90000 05555");
      click(q("[data-create-number]"));
      ok("list empty state prefills the number", qOpen() && q("#qlMobile").value === "90000 05555");
      key("Escape"); ok("Esc closes the quick lead", !qOpen());
      var s = q("[data-search-input]"); click(q("[data-tb-search]")); s.value = "+91 90000 06666"; s.dispatchEvent(new (W().Event)("input", { bubbles: true }));
      click(q("[data-sr-create]"));
      ok("search: Create lead with this number prefills cc + number", qOpen() && q("#qlMobile").value === "90000 06666" && q("#qlCc").value === "+91");
      click(QD().querySelector("[data-close]"));
    });
    step("Quick lead owner rules + leads.create + saved without a profile (#118)", function () {
      var A = W().App, P = A.Perm;
      A.setRole("Sales Executive"); click(q(".topbar [data-new-lead]"));
      var opts = function () { return Array.prototype.map.call(qa("#qlOwner option"), function (o) { return o.value + ":" + o.textContent; }); };
      ok("SE (leads.own, no leads.assign): owner = me only, no Unassigned", opts().length === 1 && /^u6:/.test(opts()[0]), opts().join());
      key("Escape");
      A.setRole("Sales Manager"); click(q(".topbar [data-new-lead]"));
      ok("SM (leads.assign): me first + others + Unassigned", /^u5:.*\(me\)/.test(opts()[0]) && opts().some(function (o) { return /^u6:/.test(o); }) && /^:Unassigned$/.test(opts()[opts().length - 1]), opts().join());
      key("Escape");
      // SE without leads.own -> Unassigned (New); can't see Unassigned -> confirmation only, no profile
      P.save([{ short: "SE", key: "leads.own", value: false }]); A.setRole("Sales Executive"); click(q(".topbar [data-new-lead]"));
      ok("no leads.own: Unassigned only + hint", opts().join() === ":Unassigned" && /saved Unassigned \(New\)/.test(text("#quickLeadDrawer")), opts().join());
      var n = D().people.length;
      type("#qlMobile", "90000 07111"); type("#qlName", "Kiran Bedi"); pickSel("qlSource", "Walk-in"); click(q('[data-ql="save"]'));
      var np = D().people[D().people.length - 1];
      ok("saved Unassigned · New, no profile (SE can't see Unassigned), confirmation", D().people.length === n + 1 && np.ownerUserId === null && np.unassignedReason === "New" && np.phone === "+919000007111" &&
        !q("#profileDrawer.open") && !qOpen() && /Unassigned \(New\)/.test(text(".toast-wrap, .toasts, body")));
      P.save([{ short: "SE", key: "leads.own", value: true }, { short: "SE", key: "leads.create", value: false }]); A.setRole("Sales Executive");
      click(q(".topbar [data-new-lead]")); ok("leads.create = No: quick lead doesn't open", !qOpen());
      P.save([{ short: "SE", key: "leads.create", value: true }]);
    });
    step("Lead events: StageChanged, MarkedLost, Reopened; leads.markLost checked", function () {
      var A = W().App, ev = function (t) { return A.Event.of("p2", t); };
      A.setRole("CEO");
      A.openProfile("p2", { state: "normal" }); click(q('[data-tab-k="details"]')); click(q('[data-pd="edit"]'));
      var f = q("[data-details]"), st = f.elements.stage; var old = st.value; st.value = old === "Negotiation" ? "Contacted" : "Negotiation"; click(q('[data-pd="saveEdit"]'));
      ok("stage change -> StageChanged event + timeline", ev("StageChanged").length === 1 && ev("StageChanged")[0].from === old && D().timeline.some(function (t) { return t.personId === "p2" && /Stage changed/.test(t.text); }));
      A.closeProfile();
      A.Lead.markLost("p2"); click(q('#lostModal [data-chip]')); click(q("#lostModal [data-save]"));
      ok("Mark lost -> MarkedLost event", ev("MarkedLost").length === 1 && ev("MarkedLost")[0].to === "Lost");
      A.Lead.reopen("p2"); click(q("#reopenModal [data-save]")); Array.prototype.forEach.call(qa(".modal.open [data-close]"), function (c) { click(c); });
      ok("Re-open -> Reopened event", ev("Reopened").length === 1 && ev("Reopened")[0].from === "Lost");
      A.Perm.save([{ short: "SE", key: "leads.markLost", value: "None" }]); A.setRole("Sales Executive");
      A.Lead.markLost("p1"); ok("leads.markLost None: Mark lost refused", !q("#lostModal.open") && A.byId(D().people, "p1").stage !== "Lost");
      A.Perm.save([{ short: "SE", key: "leads.markLost", value: "Own" }]); A.setRole("CEO");
    });
    step("Leads Source filter follows the branch", function () {
      var A = W().App, so = function () { return Array.prototype.map.call(qa("#fSource option"), function (o) { return o.textContent; }); };
      A.setBranch("all");
      ok("All branches: every source, branch-only ones tagged", so().indexOf("Hoarding · Sec 31") > -1 && so().indexOf("Pamphlet · Sec 31, Sec 65") > -1 && so().indexOf("Walk-in") > -1, so().join());
      A.setBranch("b3");
      ok("Golf Course: company-wide only (no Hoarding / Pamphlet)", so().indexOf("Walk-in") > -1 && !so().some(function (t) { return /Hoarding|Pamphlet/.test(t); }), so().join());
      A.setBranch("b1"); change("#fSource", "Hoarding");
      ok("Sec 31: Hoarding offered untagged; filter keeps the branch", so().indexOf("Hoarding") > -1 && A.state.branchId === "b1");
      A.setBranch("all");
    });
    step("Edit lead: saved source not used at the lead's branch", function () {
      var p = W().App.byId(W().DUMMY.people, "p1"), old = p.source, ob = p.branchId; p.source = "Hoarding"; p.branchId = "b3";
      W().App.openProfile("p1", { state: "normal" }); click(q('[data-tab-k="details"]')); click(q('[data-pd="edit"]'));
      var sel = q('[data-details] select[name="source"]'), opts = Array.prototype.map.call(sel.options, function (o) { return o.value; });
      ok("saved source kept + note", sel.value === "Hoarding" && /Not used at this branch/.test(text("[data-details]")) && opts.indexOf("Pamphlet") < 0, opts.join());
      p.source = old; p.branchId = ob; W().App.closeProfile();
    });
    step("Drawer width setting applies to every drawer", function () {
      Dc().documentElement.setAttribute("data-drawer", "60");
      click(q(".topbar [data-new-lead]"));
      ok("quick lead 60%", Math.abs(width("quickLeadDrawer") - W().innerWidth * 0.6) < 3, width("quickLeadDrawer"));
      key("Escape");
      W().App.openProfile("p1", { state: "normal" });
      ok("profile 60%", Math.abs(width("profileDrawer") - W().innerWidth * 0.6) < 3);
      click(q('#profileDrawer [data-pd="convert"]'));
      ok("sell mode at least 80%", width("profileDrawer") >= W().innerWidth * 0.79, width("profileDrawer"));
      key("Escape"); key("Escape");
      Dc().documentElement.setAttribute("data-drawer", "70");
    });
    step("Profile: Corporate entry section on Membership", function () {
      W().App.setRole("CEO"); W().App.setBranch("all");
      W().App.openProfile("p12", { state: "normal", tab: "membership" });
      ok("one section: Corporate entry: FF ID & key fob", /Corporate entry: FF ID & key fob/i.test(text("[data-corp]")) && /FF ID pending/.test(text("[data-corp]")) && /Key fob pending/.test(text("[data-corp]")), text("[data-corp]") + " / " + text(".pd-tabs .tab.active"));
      ok("NEXT STEP groups the two", /Corporate entry: FF ID & key fob/.test(text(".next-step")));
      key("Escape");
    });
    load(PKGS, function () {
      step("package edit drawer follows the setting", function () {
        W().App.setRole("CEO");
        var add = q("#btnNew");
        if (add) click(add);
        var d = q(".drawer.open");
        ok("package drawer uses the drawer width (70%)", !!d && Math.abs(d.getBoundingClientRect().width - W().innerWidth * 0.7) < 3, d ? d.getBoundingClientRect().width : "no drawer");
        key("Escape");
      });
      load(PKGS + "?x=1", function () {
        step("+ Lead on a page without the form goes to Leads", function () {
          fr.onload = null; click(q(".topbar [data-new-lead]"));
        });
        setTimeout(function () {
          ok("leads page opens with quick lead (?new=1)", /features\/leads\/index\.html/.test(W().location.href) && qOpen(), W().location.href);
          load(LEADS, function () {
            ok("tablet 900px: drawer 92%", (click(q(".topbar [data-new-lead]")), Math.abs(width("quickLeadDrawer") - W().innerWidth * 0.92) < 3), width("quickLeadDrawer"));
            document.getElementById("out").textContent = out.join("\n");
          }, 900);
        }, 1500);
      });
    });
  });
});
</script></body></html>
