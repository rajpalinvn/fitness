<!doctype html>
<html><head><meta charset="utf-8"></head><body><pre id="out">running</pre>
<iframe id="f" style="width:1280px;height:900px"></iframe>
<script>
// c23: Part 1 clients.edit (#126) · Part 2 lead form + follow-up comments (#127) · Part 3 searchable dropdowns (#128) · Part 4 renew in advance (#129).
var ROOT = "../../", CL = ROOT + "features/clients/index.html";
var out = [], fr = document.getElementById("f");
function ok(name, cond, extra) { out.push((cond ? "PASS " : "FAIL ") + name + (extra != null && !cond ? "  [" + extra + "]" : "")); }
function load(url, cb) { fr.onload = function () { fr.onload = null; setTimeout(cb, 900); }; fr.src = url; }
function W() { return fr.contentWindow; } function Dc() { return W().document; } function A() { return W().App; } function D() { return W().DUMMY; }
function q(s) { return Dc().querySelector(s); } function qa(s) { return Dc().querySelectorAll(s); }
function click(el) { if (!el) throw new Error("missing element"); el.dispatchEvent(new (W().MouseEvent)("click", { bubbles: true })); }
function text(s) { var e = q(s); return e ? e.innerText : ""; }
function setVal(s, v) { var e = typeof s === "string" ? q(s) : s; e.value = v; e.dispatchEvent(new (W().Event)("input", { bubbles: true })); e.dispatchEvent(new (W().Event)("change", { bubbles: true })); }
function step(name, fn) { try { fn(); } catch (e) { ok(name + " (threw)", false, e.message); } }
function badText() { return /\bnull\b|\bundefined\b|Jan 0001|\[object Object\]|NaN|Invalid Date/.exec(Dc().body.innerText); }
function role(r) { A().setRole(r); }
function openP(id, tab) { A().openProfile(id, { state: "normal", tab: tab }); }
function person(id) { return A().byId(D().people, id); }
function finish() { document.getElementById("out").textContent = out.join("\n"); }

load(CL, function () {
  ["mock.perms", "mock.branch"].forEach(function (k) { W().sessionStorage.removeItem(k); });
  W().sessionStorage.setItem("mock.role", "CEO");
  load(CL, function () {
    // ---------- Part 1 ----------
    step("Part 1: clients.edit grid row", function () {
      var d = D().permissionDefs.filter(function (x) { return x.key === "clients.edit"; })[0];
      ok("row: scope, CEO All, RM/CM/SM Branch, SE Own, others None", !!d && d.type === "scope" && d.defaults.CEO === "All" && d.defaults.RM === "Branch" && d.defaults.CM === "Branch" && d.defaults.SM === "Branch" && d.defaults.SE === "Own" && !d.defaults.MXM && !d.defaults.FIN);
    });
    step("Part 1: Details edit + follow-ups by scope", function () {
      role("Sales Executive");   // Priya, owns p7 / p12 (Sec 31)
      openP("p7", "details");
      ok("SE own client: Edit shown", !!q('#profileDrawer [data-pd="edit"]'));
      ok("SE own client: follow-up allowed", A().Followup.blockReason(person("p7")) === "");
      role("Club Manager");   // Sunita, Sec 31
      openP("p24", "details");
      ok("CM other branch client (Zoya, Golf Course): no Edit, follow-up blocked", !q('#profileDrawer [data-pd="edit"]') && !!q("#profileDrawer [data-no-edit]") && /can't add follow-ups/.test(A().Followup.blockReason(person("p24"))));
      role("MXM");
      ok("MXM (None): follow-up blocked on any client", /can't add follow-ups/.test(A().Followup.blockReason(person("p7"))));
      role("CEO");
      ok("CEO: everything", A().Followup.blockReason(person("p24")) === "" && A().canEditDetails(person("p24")));
      ok("leads unchanged by clients.edit", A().canEditDetails(person("p1")));
    });
    step("Part 1: FF ID read-only in Details; Add FF ID only while empty + issueItems", function () {
      openP("p7", "details"); click(q('#profileDrawer [data-pd="edit"]'));
      ok("client edit form: FF ID read-only text, no input", !!q("#profileDrawer [data-ff-ro]") && !q('#profileDrawer [data-details] [name="ffId"]') && /FF-19877/.test(text("#profileDrawer [data-ff-ro]")));
      click(q('#profileDrawer [data-pd="cancelEdit"]'));
      A().addFfId("p7");
      ok("FF ID set: Add FF ID refused", !(q("#ffModal") && q("#ffModal").classList.contains("open")) && person("p7").ffId === "FF-19877");
      role("MXM"); A().addFfId("p12");
      ok("no clients.issueItems: refused", !(q("#ffModal") && q("#ffModal").classList.contains("open")) && !person("p12").ffId);
      role("CEO"); openP("p12", "membership");
      ok("empty + allowed: Add FF ID button on Membership", !!q('#profileDrawer [data-pd="addFf"]'));
      A().closeAll(); A().closeAll();
      ok("no bad text", !badText(), badText());
    });
    // ---------- Part 2 ----------
    step("Part 2: follow-up notes required", function () {
      role("CEO");
      A().Followup.openAdd("p2");
      click(q("#fuAddModal [data-save]"));
      ok("Add follow-up: note required", !q("#fuAddModal .ff-nerr").hidden && q("#fuAddModal").classList.contains("open"));
      q("#fuAddModal .ff-note").value = "Call about the trial"; click(q("#fuAddModal [data-save]"));
      ok("saved with the note", !q("#fuAddModal").classList.contains("open"));
      var f = D().followUps.filter(function (x) { return x.personId === "p2" && x.status === "Open"; }).pop();
      A().Followup.openOutcome(f.id);
      click(q('#fuOutcomeModal [data-chip="Interested"], #fuOutcomeModal [data-chip][data-val="Interested"]') || Array.prototype.filter.call(qa("#fuOutcomeModal [data-chip]"), function (c) { return /Interested/.test(c.textContent) && !/Not/.test(c.textContent); })[0]);
      click(q("#fuOutcomeModal [data-save]"));
      ok("Log outcome: note required", !q("#fuOutcomeModal [data-onerr]").hidden && f.status === "Open");
      A().closeAll();
    });
    step("Part 2: Source vs Inquiry type, Campaign, Referred by, no FF ID on leads", function () {
      var Ls = D().lists;
      ok("inquiry types fixed list", Ls.inquiryTypes.join() === "Walk-in,Phone call,WhatsApp,Website form,Social DM");
      ok("sources = marketing channels (no Walk-in / Phone / WhatsApp)", !/Walk-in|Phone Call|WhatsApp/.test(Ls.sources.join()) && Ls.campaignSources.join() === "Facebook,Instagram,Google ads");
      A().QuickLead.open({ mobile: "90000 08888" });
      ok("quick lead: no FF ID, Inquiry type required in the main part", !q("#qlFf") && !!q("#qlInq") && /Inquiry type \*/.test(q('label[for="qlInq"]') ? q('label[for="qlInq"]').innerText.replace(/\s+/g, " ") : text("#quickLeadDrawer")));
      ok("Campaign + Referred by hidden until a matching source", q('#quickLeadDrawer [data-src-show="campaign"]').hidden && q('#quickLeadDrawer [data-src-show="referral"]').hidden);
      setVal("#qlName", "Test Person"); setVal("#qlSource", "Facebook");
      ok("Facebook: Campaign shown", !q('#quickLeadDrawer [data-src-show="campaign"]').hidden && q('#quickLeadDrawer [data-src-show="referral"]').hidden);
      setVal("#qlSource", "Referral");
      ok("Referral: Referred by shown, Campaign hidden", !q('#quickLeadDrawer [data-src-show="referral"]').hidden && q('#quickLeadDrawer [data-src-show="campaign"]').hidden);
      click(q('[data-ql="save"]'));
      ok("required: inquiry type + referred by", /Choose how they contacted us/.test(text("#quickLeadDrawer")) && /Who referred them/.test(text("#quickLeadDrawer")));
      setVal("#qlRef", "Vivaan");
      ok("search an existing client", !!q('#quickLeadDrawer [data-ref-pick="p7"]'));
      click(q('#quickLeadDrawer [data-ref-pick="p7"]'));
      setVal("#qlInq", "WhatsApp"); click(q('[data-ql="save"]'));
      var p = D().people[D().people.length - 1];
      ok("saved: referredById = Vivaan, inquiry WhatsApp, no campaign, no FF ID", p.name === "Test Person" && p.referredById === "p7" && p.referredBy === "Vivaan Joshi" && p.inquiryType === "WhatsApp" && !p.campaign && !p.ffId, JSON.stringify([p.referredById, p.referredBy, p.inquiryType]));
      A().closeAll(); A().closeAll();
      openP("p1", "details");
      ok("lead details: no FF ID", !/FF ID/.test(text("#profileDrawer .pd-body, #profileDrawer")) || !/FF ID/.test(text("#profileDrawer dl")));
      click(q('#profileDrawer [data-pd="edit"]'));
      ok("lead edit form: no FF ID input", !q('#profileDrawer [data-details] [name="ffId"]'));
      A().closeAll();
    });
    // ---------- Part 3 ----------
    step("Part 3: searchable dropdowns", function () {
      A().closeAll(); A().closeAll();
      click(q('[data-dd="sel-fRep"]'));
      var m = q('[data-dd-menu="sel-fRep"]'), s = m.querySelector("[data-dd-search]");
      ok("Sales rep filter: search box, focused", !!s && Dc().activeElement === s);
      setVal(s, "priya");
      var vis = Array.prototype.filter.call(m.querySelectorAll("[data-sel]"), function (b) { return !b.hidden && b.dataset.val; });
      ok("type to filter", vis.length === 1 && /Priya/.test(vis[0].textContent), vis.length);
      setVal(s, "zzzz");
      ok("No match", !m.querySelector("[data-dd-nomatch]").hidden);
      click(Dc().body);
      click(q('[data-dd="sel-fStatus"]'));
      ok("short fixed list (status) stays plain", !q('[data-dd-menu="sel-fStatus"] [data-dd-search]'));
      click(Dc().body);
      ok("rule: Owner / Assigned to / Sales rep / Source / Branch / staff pickers / package / state",
        ["fOwner", "fRep", "fBranch", "fSource", "qlOwner", "qlBranch", "qlSource", "assignUser", "ffAssignp1", "cvRep", "trTrainer", "qPkg", "sfBranch", "brState", "pickSe", "movePerson"].every(function (id) { return A().SEARCH_SELECT.test(id); }) &&
        !A().SEARCH_SELECT.test("qlGender") && !A().SEARCH_SELECT.test("fStatus"));
      A().QuickLead.open({});
      click(q('[data-dd="sel-qlSource"]'));
      ok("quick lead Source is searchable", !!q('[data-dd-menu="sel-qlSource"] [data-dd-search]'));
      click(Dc().body); A().closeAll();
      openP("p2", "timeline"); A().Lead.markLost("p2");
      var lm = q("#lostModal"), lf = lm.querySelector("[data-chip-filter]");
      ok("Lost reason: filter box", !!lf);
      setVal(lf, "timing");
      var shown = Array.prototype.filter.call(lm.querySelectorAll("[data-chip]"), function (c) { return !c.hidden; });
      ok("filters the reasons", shown.length === 1 && /Timing/.test(shown[0].textContent));
      setVal(lf, "zzz"); ok("No match", !lm.querySelector("[data-chip-nomatch]").hidden);
      A().closeAll(); A().closeAll();
    });
    // ---------- Part 4 ----------
    step("Part 4: Book trial only for leads and Ex-clients", function () {
      role("CEO");
      openP("p7"); ok("active client: Book trial for PT only (#130)", !!q('#profileDrawer [data-pd="trial"]') && A().Trial.packagesFor(person("p7")).every(function (x) { return x.category === "PT"; }));
      openP("p22"); ok("Ex-client (Tarun): Book trial shown", !!q('#profileDrawer [data-pd="trial"]'));
      ok("Ex-client books like a lead (membership trials offered)", A().Trial.packagesFor(person("p22")).some(function (x) { return x.category === "Membership"; }));
      openP("p22"); ok("Ex-client: no Renew", !q('#profileDrawer [data-pd="renew"]'));
      A().closeAll();
    });
    step("Part 4: Renew shown on profile, Clients row, Today", function () {
      ok("Clients row (renewal due, Divya p19): Renew", !!q('#rows tr[data-id="p19"] [data-act="renew"]'));
      openP("p19", "membership");
      ok("profile: 'Renew in advance' + start = end + 1", !!q('#profileDrawer [data-pd="renew"]') && /Renew in advance/.test(text("#profileDrawer")) && A().Renew.startIso(person("p19")) === (function () { var d = new Date(person("p19").membership.end); d.setDate(d.getDate() + 1); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); })());
      openP("p21", "membership");
      ok("expired client (Pallavi p21): 'Renew', start today", /Renew/.test(text('#profileDrawer [data-pd="renew"]')) && !/advance/.test(text('#profileDrawer [data-pd="renew"]')) && A().Renew.startIso(person("p21")) === new Date().toISOString().slice(0, 10).replace(/^(\d+)-(\d+)-(\d+)$/, function () { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }));
      A().closeAll();
    });
    step("Part 4: renew in advance (Divya p19, owner Priya -> CEO)", function () {
      var p = person("p19"), ff = p.ffId, fob = p.keyFob, oldEnd = p.membership.end, oldOwner = p.ownerUserId;
      A().Renew.open("p19");
      var sm = q("#sellMode");
      ok("work mode in the drawer: steps Package, Sale & start, Summary, Payment", !!sm && Array.prototype.map.call(qa("#sellMode .step"), function (s) { return s.textContent.replace(/^\d/, "").trim(); }).join(",") === "Package,Sale & start,Summary,Payment");
      ok("only membership packages (renewal / both), no PT, no trials", !q('#sellMode [data-pkg="pk1"]') && !q('#sellMode [data-pkg="pk14"]') && !!q('#sellMode [data-pkg="pk4"]'));
      click(q('#sellMode [data-pkg="pk4"]')); click(q('#sellMode [data-cv="next"]'));
      ok("start locked = end + 1 (future), sales rep = seller (locked)", q("#cvStart").disabled && q("#cvStart").value === A().Renew.startIso(p) && q("#cvRep").disabled && q("#cvRep").value === "u2");
      click(q('#sellMode [data-cv="next"]'));
      ok("summary: FF ID and key fob stay the same; owner -> seller", /Stay the same/.test(text("#sellMode")) && /Anita Kapoor \(you, the seller\)/.test(text("#sellMode")));
      click(q('#sellMode [data-cv="next"]')); click(q('#sellMode [data-cv="finish"]'));
      ok("saved as next membership; current kept", !!p.nextMembership && p.membership.end === oldEnd && p.nextMembership.packageId === "pk4" && A().daysFromToday(p.nextMembership.start) > 0);
      ok("owner = seller (event), sales rep = seller", p.ownerUserId === "u2" && oldOwner !== "u2" && p.nextMembership.salesRepUserId === "u2" && D().events.some(function (e) { return e.personId === "p19" && e.type === "OwnerChanged"; }));
      ok("FF ID + key fob unchanged", p.ffId === ff && p.keyFob === fob);
      ok("no longer renewal due; Renew gone", !A().packagesNeedingRenewal(p).length && !A().Renew.can(p));
      A().closeAll(); A().closeAll();
    });
    step("Part 4: renew an expired client (Pallavi p21) from today", function () {
      var p = person("p21");
      A().Renew.open("p21"); click(q('#sellMode [data-pkg="pk4"]')); click(q('#sellMode [data-cv="next"]'));
      ok("hint: starts today", /starts today/.test(text("#sellMode")));
      click(q('#sellMode [data-cv="next"]')); click(q('#sellMode [data-cv="next"]')); click(q('#sellMode [data-cv="finish"]'));
      ok("membership replaced, starts today, old one kept in history", A().daysFromToday(p.membership.start) === 0 && (p.pastMemberships || []).length === 1 && !p.nextMembership);
      A().closeAll(); A().closeAll();
    });
    load(ROOT + "features/today/index.html", function () {
      step("Part 4: Today 'Renewals due' section", function () {
        ok("section with Renew action", !!q("#sec-renewals") && !!q('#sec-renewals [data-act="renew"]'), text("#sec-renewals"));
        ok("no bad text", !badText(), badText());
      });
      finish();
    });
    return;
  });
});
</script>
</body></html>
