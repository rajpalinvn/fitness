<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leads · Fitness Labs</title>
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../shared/styles.css">
  <script src="../../shared/data.js"></script>
  <script src="../../shared/app.js"></script>
  <script src="../../shared/shell.js"></script>
  <script src="../../shared/followup.js"></script>
  <script src="../../shared/profile.js"></script>
  <script src="../../shared/convert.js"></script>
</head>
<body>
<div class="app" data-shell="leads" data-root="../../">
  <main class="main">

    <!-- Debug bar: only with ?debug in the URL -->
    <div class="debug-bar" id="debugBar" hidden>
      <strong>Test states:</strong>
      <button class="btn btn-sm" data-state="normal">Normal</button>
      <button class="btn btn-sm" data-state="loading">Loading</button>
      <button class="btn btn-sm" data-state="empty">Empty (no leads)</button>
      <button class="btn btn-sm" data-state="error">Error</button>
    </div>

    <!-- Page title lives in the top bar; "+ Lead" lives only in the top bar. -->
    <div class="page-head">
      <span class="muted" id="leadCount"></span>
    </div>

    <!-- Pipeline cards: click = filter, click again = clear -->
    <div class="pipeline" id="pipeline"></div>

    <!-- Search + filters -->
    <div class="filter-bar">
      <input class="input grow" type="search" id="fSearch" placeholder="Filter: name, mobile, email" aria-label="Filter this list">
      <select class="input" id="fStage" aria-label="Stage"></select>
      <select class="input tablet-hide" id="fOwner" aria-label="Owner"></select>
      <select class="input tablet-hide" id="fSource" aria-label="Source"></select>
      <select class="input tablet-hide" id="fBranch" aria-label="Branch"></select>
      <button class="btn" id="btnMore">More filters <span data-icon="chevron-down"></span></button>
      <button class="btn btn-ghost" id="btnClear">Clear all</button>
    </div>

    <div class="more-filters" id="moreFilters">
      <!-- On tablet the main filters move in here -->
      <div class="field tablet-only-filter"><label for="mOwner">Owner</label><select class="input" id="mOwner"></select></div>
      <div class="field tablet-only-filter"><label for="mSource">Source</label><select class="input" id="mSource"></select></div>
      <div class="field tablet-only-filter"><label for="mBranch">Branch</label><select class="input" id="mBranch"></select></div>
      <div class="field"><label for="fTemp">Temperature</label><select class="input" id="fTemp"></select></div>
      <div class="field"><label for="fFollow">Follow-up</label><select class="input" id="fFollow"></select></div>
      <div class="field"><label for="fFrom">Created from</label><input class="input" type="date" id="fFrom"></div>
      <div class="field"><label for="fTo">Created to</label><input class="input" type="date" id="fTo"></div>
      <div class="field"><label><input type="checkbox" id="fSynced"> Synced leads only</label></div>
    </div>

    <div class="active-filters" id="activeFilters"></div>

    <div id="errorBanner" class="banner banner-danger" hidden>
      <strong>Couldn't load leads.</strong> Please check your connection.
      <button class="btn btn-sm" id="btnRetry">Retry</button>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th class="sticky-1">Name &amp; mobile</th>
            <th class="sticky-2 col-next">NEXT FOLLOW-UP</th>
            <th>Stage / temperature</th>
            <th>Source</th>
            <th>Owner</th>
            <th class="col-branch">Branch</th>
            <th>Last activity</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="stateBox"></div>
    </div>
  </main>
</div>

<!-- Profile drawer, follow-up, assign, lost and re-open modals are built by shared/profile.js + shared/followup.js -->
<script src="leads.js"></script>
</body>
</html>
