<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packages · Settings · Fitness Labs</title>
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../shared/styles.css">
  <script src="../../shared/data.js"></script>
  <script src="../../shared/app.js"></script>
  <script src="../../shared/shell.js"></script>
</head>
<body>
<div class="app" data-shell="settings" data-root="../../" data-title="Packages">
  <main class="main">

    <div class="debug-bar" id="debugBar" hidden>
      <strong>Test states:</strong>
      <button class="btn btn-sm" data-state="normal">Normal</button>
      <button class="btn btn-sm" data-state="loading">Loading</button>
      <button class="btn btn-sm" data-state="empty">Empty</button>
      <button class="btn btn-sm" data-state="error">Error</button>
    </div>

    <div class="page-head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Settings</a><span aria-hidden="true">/</span><span>Packages</span></nav>
      <button class="btn btn-primary" id="btnNew" hidden><span data-icon="plus"></span>Package</button>
    </div>
    <div id="banner" hidden></div>

    <div id="content">
      <div class="tabs" role="tablist" id="catTabs"></div>
      <div class="filter-bar">
        <input class="input grow" type="search" id="fSearch" placeholder="Filter: package name" aria-label="Filter packages">
        <select class="input" id="fBranch" aria-label="Branch"></select>
        <select class="input" id="fStatus" aria-label="Status">
          <option value="">Active and inactive</option><option value="active">Active</option><option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="table-wrap">
        <table class="table table-admin">
          <thead><tr><th>Package</th><th>Category</th><th>Length</th><th>Price incl. GST</th><th>Tags</th><th>Branches</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>
<script src="admin.js"></script>
<script src="packages.js"></script>
</body>
</html>
